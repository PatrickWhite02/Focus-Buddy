plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.FocusBuddy'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.FocusBuddy'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // In-app QR scanner, bundled with the app (no Google Play services, no download)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // The scanner calls ContextCompat for its camera-permission check but doesn't bring AndroidX Core
    // with it. (It used to arrive through the Google scanner library.)
    implementation 'androidx.core:core:1.13.1'
}